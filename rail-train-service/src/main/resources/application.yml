# =============================================================================
#  rail-train-service  车次服务  端口 8082
# =============================================================================
#  端口分配见 docs/decisions/ADR-003-service-granularity.md：
#    8080 gateway / 8081 user / 8082 train / 8083 inventory / 8084 order
#  现在只有 train 一个服务在跑，但端口按终态分配，
#  这样阶段 8 拆分时不需要回来改配置（也就不会顺手改错）。
# =============================================================================

server:
  port: 8082

spring:
  application:
    name: rail-train-service
  # ---------------------------------------------------------------------------
  # 本地私有配置的加载机制
  # ---------------------------------------------------------------------------
  #   optional:  前缀表示"文件不存在也没关系"，不会导致启动失败
  #   classpath: 表示从 resources / classes 目录找
  #
  # 【为什么需要它】
  #   application-local.yml 在 .gitignore 里，**不进版本库**——
  #   它是本机真实密码的存放处，别人 clone 下来拿不到，也就不会误用。
  #   Spring Boot 默认不会加载它（因为它不是 application.yml，
  #   只有激活 local profile 才会被当作 application-local.yml 加载）。
  #   显式 import 之后，**只要文件存在就自动生效**，比记住加 --spring.profiles.active=local 可靠。
  #
  #   同名配置项的优先级：application-local.yml > 本文件（后加载的覆盖先加载的）
  config:
    import: optional:classpath:application-local.yml

  # ---------------------------------------------------------------------------
  # 数据源：只连 rail_train 这一个库
  # ---------------------------------------------------------------------------
  # 【为什么连的是库而不是表，为什么只给一个库】
  #   rail_train 是 train-service 的**数据所有权边界**（见 ADR-003 的数据所有权表）。
  #   订单、库存、用户分别在另外三个库里，本服务**没有权限也不需要**知道它们。
  #   这不是"约定"，是物理隔离——账号 rail 虽然有四个库的权限（本地开发图方便），
  #   但代码里只出现 rail_train 的连接串，跨库查询就没有可乘之机。
  datasource:
    # -------------------------------------------------------------------------
    # JDBC URL 里每个参数的来历（都不是抄的，每一条都有具体原因）
    # -------------------------------------------------------------------------
    #   useSSL=false
    #       本地 MySQL 没配证书。开着 SSL 也能连，但会多一次 TLS 握手，
    #       而且证书校验会失败。⚠️ 生产环境必须打开，并配好信任链。
    #   allowPublicKeyRetrieval=true
    #       MySQL 8.4 默认认证插件是 caching_sha2_password。首次认证时，
    #       客户端需要向服务端索取 RSA 公钥来加密密码。
    #       **明文连接下默认不允许索取**（防止中间人替换公钥），所以要显式打开。
    #       去掉它的症状是：第一次连报 "Public Key Retrieval is not allowed"，
    #       而重启 MySQL 或清空缓存后又会复现——很难定位。
    #       ⚠️ 同样是本地开发的妥协：它确实降低了中间人攻击的成本。
    #   connectionTimeZone=+08:00 & forceConnectionTimeZoneToSession=true
    #       这两个是**成对出现才有意义**的，只知其一很容易配错。
    #       · connectionTimeZone：驱动按哪个时区解释 DATETIME
    #       · forceConnectionTimeZoneToSession：同时把 MySQL 会话的 time_zone 也设成它
    #       两个都设，Java 对象 ↔ DATETIME 之间才是**原样往返**，不做任何时区平移。
    #       只设前者不设后者：JDBC 侧按东八区解释、服务端按系统时区（可能是 UTC）解释，
    #       同一个 DATETIME 读出来会差 8 小时——**而且字符类型完全正常，只有时间错**。
    #
    #   ⚠️⚠️ 这里写的是 **+08:00 而不是 Asia/Shanghai**，这是踩过坑之后的写法。
    #       写成 Asia/Shanghai 会导致**整个服务连不上数据库**，报：
    #           java.sql.SQLException: Unknown or incorrect time zone: 'Asia/Shanghai'
    #       原因：Windows 版 MySQL **不带时区数据**（mysql.time_zone_name 表是空的，
    #       实测 0 行）。填充它需要 mysql_tzinfo_to_sql 工具，而该工具只在 Unix 上提供。
    #       而数字偏移 '+08:00' 不查表、直接解析，所以一定能用（已在本机实测通过）。
    #
    #       为什么用数字偏移是安全的：中国自 1991 年起废止夏令时，
    #       东八区是**全年恒定**的，不存在"某天偏移量变一小时"的问题。
    #       如果一个项目要服务多时区，或部署在有夏令时的国家，就必须填充时区表，
    #       不能图省事用数字偏移——**这个前提要写清楚，否则就是埋雷**。
    #
    #   ⚠️ 不要再用 serverTimezone：它在 Connector/J 8.0.23 起已被
    #      connectionTimeZone 取代。浏览器上搜到的老教程还在用，
    #      但新驱动上的行为不再有保证。
    #
    #   字符集用 characterEncoding=UTF-8：
    #       驱动会据此把连接字符集协商成 utf8mb4（服务端支持的话），
    #       这样 emoji 和生僻汉字都能存。⚠️ 注意这里**不是** JVM 的 file.encoding，
    #       两者独立，本机 JVM 是 GBK 也不影响这里。
    url: jdbc:mysql://127.0.0.1:3306/rail_train?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8

    # 【为什么用 127.0.0.1 而不是 localhost】
    #   MySQL 把 localhost 和 127.0.0.1 当作**两个不同的主机**：
    #   localhost 在 Windows 上可能走命名管道，127.0.0.1 走 TCP。
    #   建库脚本里两个 host 都授权了（sql/00_init.sql），所以两种写法都能连。
    #   这里固定用 127.0.0.1，是为了和"驱动走 TCP"这个事实保持一致——
    #   排查问题时少一个变量。

    # -------------------------------------------------------------------------
    # 账号密码：为什么写成 ${DB_PASSWORD:rail123456} 这种形式
    # -------------------------------------------------------------------------
    #   语法是 ${环境变量名:默认值}。
    #   优先读环境变量 DB_PASSWORD，读不到就用冒号后面的默认值。
    #
    #   这样安排是为了同时满足两个互相冲突的目标：
    #     · 别人 clone 下来**不配任何东西就能直接跑**（走默认值）
    #     · 本机想用别的密码时，**不用改这个文件**（设个环境变量，或写进 application-local.yml）
    #   如果直接写死 rail123456，第二个目标就落空了，而且会诱使人把这个文件也加进 .gitignore，
    #   于是"新人拉下来跑不起来"。
    #
    #   ⚠️ 这里的 123456 级别的密码只能出现在本地开发。真实项目里应该：
    #      环境变量由密钥管理服务（如 Nacos 配置中心 + K8s Secret）下发，
    #      代码仓库里连默认值都不该有。
    username: ${DB_USERNAME:rail}
    password: ${DB_PASSWORD:rail123456}

    driver-class-name: com.mysql.cj.jdbc.Driver

# =============================================================================
#  MyBatis-Plus
# =============================================================================
mybatis-plus:
  configuration:
    # -------------------------------------------------------------------------
    # 下划线转驼峰：DB 的 station_code  →  Java 的 stationCode
    # -------------------------------------------------------------------------
    #   这个开关默认就是 true，这里显式写出来是为了**让机制可见**。
    #   它解决的问题是：DB 命名习惯是下划线（snake_case），Java 是驼峰（camelCase），
    #   如果每个字段都要在 SQL 里写 `AS stationCode`，那 MyBatis-Plus 的
    #   "单表 CRUD 不用写 SQL"这个核心价值就没了。
    #
    #   ⚠️ 它只做**机械转换**，不认缩写：
    #        t_train.start_station_id  →  startStationId   ✅
    #        t_train.train_no          →  trainNo          ✅
    #   所以字段名不需要任何注解。但这意味着**表结构设计时就要遵守下划线命名**，
    #   中途改表名会连锁影响实体类。
    map-underscore-to-camel-case: true

  global-config:
    banner: false          # 关掉启动时那行 MyBatis-Plus 的 ASCII 广告，日志干净一点
    db-config:
      # -----------------------------------------------------------------------
      # 主键策略：交给数据库的自增（AUTO_INCREMENT）
      # -----------------------------------------------------------------------
      #   可选值还有 ASSIGN_ID（雪花算法）、ASSIGN_UUID 等。
      #   这里选 auto，因为建表时每张表都定义了 BIGINT UNSIGNED AUTO_INCREMENT。
      #
      #   【为什么不用雪花算法】单库单表 + 本地开发，自增主键完全够用，
      #   而且它**连续**，insert 时 B+ 树是在最右侧顺序追加，不会页分裂。
      #   【什么时候必须换雪花】分库分表时——多个库各自自增会撞 ID。
      #   本项目不涉及分库分表，所以不引入雪花算法带来的 ID 可读性下降
      #   （BIGINT 变成 19 位数字）这个代价。
      id-type: auto

# =============================================================================
#  日志
# =============================================================================
logging:
  level:
    # -------------------------------------------------------------------------
    # 把 mapper 包的日志级别开到 debug，就能看到 MyBatis 实际执行的 SQL 和参数
    # -------------------------------------------------------------------------
    #   这是**开发阶段最重要的调试手段**：接口返回的数据不对时，第一件事是
    #   确认"到底是 SQL 拼错了，还是数据库里本来就没数据"。
    #   只看 Java 代码是分不清这两者的。
    #
    #   【为什么不用 mybatis-plus.configuration.log-impl: StdOutImpl】
    #   那个写法把 SQL 直接 System.out.println 出来，绕过了日志框架——
    #   意味着你无法通过配置在压测时关掉它，也无法把它写进日志文件。
    #   用 logging.level 的方式，MyBatis 会自动走 SLF4J，
    #   阶段 6 压测时只要把这一行删掉，SQL 打印就干净地消失了。
    #
    #   ⚠️ 压测前**必须**关掉：1000 并发下每个请求打印一条 SQL，
    #      控制台 IO 会自己变成瓶颈，测出来的数字全是假的。
    com.railseckill.train.mapper: debug
